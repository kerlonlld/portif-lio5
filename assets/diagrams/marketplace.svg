<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Caso de uso: MarketPlace</title><desc id="desc">O comprador consulta produtos, monta o carrinho e segue ao fluxo de compra; o gerenciamento persistente exige backend ainda não identificado.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d36"/><stop offset="1" stop-color="#102b50"/></linearGradient><linearGradient id="accent"><stop stop-color="#00a3ff"/><stop offset="1" stop-color="#637bff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#59c4ff"/></marker></defs>
  <rect width="900" height="360" rx="24" fill="url(#bg)"/><text x="42" y="48" fill="#8bd7ff" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2">JORNADA DO COMPRADOR · PROJETO DE ESTUDO</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle"><g fill="#142947" stroke="#3d6d9c" stroke-width="2"><rect x="35" y="113" width="180" height="142" rx="18"/><rect x="250" y="113" width="180" height="142" rx="18"/><rect x="465" y="113" width="180" height="142" rx="18"/><rect x="680" y="113" width="185" height="142" rx="18"/></g><g fill="url(#accent)"><circle cx="57" cy="135" r="15"/><circle cx="272" cy="135" r="15"/><circle cx="487" cy="135" r="15"/><circle cx="702" cy="135" r="15"/></g><g fill="#071326" font-size="13" font-weight="700"><text x="57" y="140">1</text><text x="272" y="140">2</text><text x="487" y="140">3</text><text x="702" y="140">4</text></g><g fill="#fff" font-size="17" font-weight="700"><text x="125" y="177">Comprador</text><text x="340" y="177">Busca produtos</text><text x="555" y="177">Adiciona ao carrinho</text><text x="772" y="177">Finaliza compra</text></g><g fill="#bfd4eb" font-size="13"><text x="125" y="204"><tspan x="125">Entra no</tspan><tspan x="125" dy="18">marketplace</tspan></text><text x="340" y="204"><tspan x="340">Navega pelo</tspan><tspan x="340" dy="18">catálogo</tspan></text><text x="555" y="204"><tspan x="555">Revisa os itens</tspan><tspan x="555" dy="18">selecionados</tspan></text><text x="772" y="204"><tspan x="772">Resumo demo</tspan></text><text x="772" y="224"><tspan x="772">sem pagamento real</tspan></text></g><g fill="none" stroke="#59c4ff" stroke-width="3" marker-end="url(#arrow)"><path d="M218 184h25"/><path d="M433 184h25"/><path d="M648 184h25"/></g></g><text x="450" y="315" fill="#91a9c4" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">GitHub Pages hospeda arquivos estáticos; pagamento e gerenciamento persistente precisam de serviços adicionais.</text>
</svg>